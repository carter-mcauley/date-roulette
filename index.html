<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34383a">
<title>Date Roulette 🎲</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f0e9;--ink:#171717;--muted:#6b6b6b;--card:#fff;--soft:#f1efec}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:42px 28px 56px}
h1{font-size:clamp(52px,11vw,92px);line-height:.88;letter-spacing:-5px;margin:0 0 20px;font-weight:850}
.intro{font-size:clamp(20px,4vw,29px);line-height:1.3;color:var(--muted);margin:0 0 38px;letter-spacing:-.7px}
.card{background:var(--card);border-radius:34px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.control{background:var(--soft);border-radius:25px;padding:20px 22px;min-height:116px}
.label{text-transform:uppercase;letter-spacing:3px;font-size:13px;color:#777;font-weight:850;margin-bottom:13px}
select{appearance:auto;width:100%;border:0;background:transparent;color:var(--ink);font-size:22px;font-weight:750;padding:0;outline:none}
button{font:inherit;border:0;cursor:pointer}
.primary{width:100%;background:#151515;color:#fff;border-radius:27px;padding:25px 20px;margin-top:20px;font-size:24px;font-weight:900;box-shadow:0 7px #000}
.primary:active{transform:translateY(4px);box-shadow:0 3px #000}
.primary:disabled{opacity:.55;cursor:default}
.secondary{width:100%;background:#ece9e5;color:#171717;border-radius:22px;padding:17px 20px;margin-top:13px;font-size:16px;font-weight:800}
.chaos-note{font-size:12px;color:#888;margin-top:10px;line-height:1.4}
.recent{margin-top:18px}.recent-title{font-size:13px;letter-spacing:3px;color:#777;font-weight:850;margin-bottom:18px}
.history-item{padding:15px 0;border-top:1px solid #e4e2df;font-size:18px;line-height:1.45}
.history-item:first-child{border-top:0;padding-top:0}
.history-item b{font-weight:850}
.clear{background:none;color:#777;text-decoration:underline;font-size:12px;padding:0;float:right}
.roulette{display:none;text-align:center;padding:42px;font-size:17px}.roulette.show{display:block}
.die{font-size:60px;display:inline-block;animation:roll .7s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
.result{display:none;margin-top:18px}.result.show{display:block}
.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:12px;color:#777;font-weight:850}
.point{font-size:36px;letter-spacing:-1.5px;font-weight:900;margin:5px 0}
.area{font-size:15px;color:#777}
.rule{background:var(--soft);border-radius:17px;padding:16px;margin-top:18px;font-size:14px;line-height:1.5}
.date{font-size:21px;line-height:1.45;margin-top:7px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{background:#eee;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800}
.map{width:100%;background:#e7efe7;color:#17451c;border-radius:20px;padding:17px;margin-top:17px;font-weight:850}
@media(max-width:520px){
 main{padding:32px 18px 42px}
 h1{letter-spacing:-3px}
 .card{border-radius:30px;padding:22px}
 .grid{gap:10px}
 .control{border-radius:22px;padding:17px;min-height:103px}
 select{font-size:18px}
 .primary{font-size:21px}
 .history-item{font-size:16px}
}
</style>
</head>
<body>
<main>
<h1>Date<br>Roulette 🎲</h1>
<p class="intro">A random Toronto neighbourhood + a date.<br>Stop planning. Just go.</p>

<section class="card">
<div class="grid">
<div class="control">
<div class="label">Area</div>
<select id="area">
<option value="any">Anywhere downtown</option>
<option value="west">West</option>
<option value="central">Central</option>
<option value="east">East</option>
<option value="waterfront">Waterfront</option>
</select>
</div>

<div class="control">
<div class="label">Vibe</div>
<select id="vibe">
<option value="any">Surprise me</option>
<option value="chill">Chill</option>
<option value="playful">Playful</option>
<option value="food">Food</option>
<option value="drinks">Drinks</option>
<option value="adventure">Adventure</option>
</select>
</div>

<div class="control">
<div class="label">Budget</div>
<select id="budget">
<option value="any">Any budget</option>
<option value="free">Mostly Free · $0–30</option>
<option value="casual">Casual · $30–60</option>
<option value="nice">Nice · $60–100</option>
<option value="treat">Treat · $100–200+</option>
</select>
</div>

<div class="control">
<div class="label">Chaos</div>
<select id="chaos">
<option value="normal">Normal</option>
<option value="mild">Mild</option>
<option value="weird">Weird</option>
<option value="chaotic">Chaotic</option>
<option value="unhinged">Unhinged</option>
</select>
<div class="chaos-note" id="chaosNote">Normal date ideas.</div>
</div>
</div>

<button class="primary" id="spin" type="button">SPIN THE DATE 🎰</button>
<button class="secondary" id="surprise" type="button">🎲 Surprise us</button>
</section>

<section id="roulette" class="card roulette">
<div class="die">🎲</div>
<div>Rolling your date…</div>
</section>

<section id="result" class="card result">
<div class="eyebrow">Where?</div>
<div class="point" id="point"></div>
<div class="area" id="areaText"></div>
<div class="rule"><b>Start here.</b> Don't plan the destination beforehand. The point is to arrive here and see what the area gives you.</div>
<div style="margin-top:20px">
<div class="eyebrow">Your date</div>
<div class="date" id="date"></div>
<div class="tags" id="tags"></div>
</div>
<button class="map" id="map" type="button">📍 Open starting point in Maps</button>
<button class="secondary" id="newDate" type="button">🎲 Spin again</button>
</section>

<section class="card recent" id="recentCard" style="display:none">
<button class="clear" id="clearHistory" type="button">Clear</button>
<div class="recent-title">RECENT DATES</div>
<div id="history"></div>
</section>
</main>

<script>
"use strict";

const locations=[
["Distillery District","Near Trinity Street",43.6503,-79.3599,"east"],
["Distillery District","Near Mill Street",43.6500,-79.3590,"east"],
["St. Lawrence","Near The Esplanade",43.6480,-79.3714,"east"],
["St. Lawrence","Near Market Street",43.6492,-79.3711,"east"],
["Old Town","Near Berczy Park",43.6485,-79.3755,"east"],
["Old Town","Near Front & Church",43.6505,-79.3762,"east"],
["Corktown","Near Underpass Park",43.6561,-79.3548,"east"],
["Leslieville","Near Queen & Carlaw",43.6625,-79.3402,"east"],
["Riverdale","Near Withrow Park",43.6738,-79.3465,"east"],
["Harbourfront","Near HTO Park",43.6389,-79.3957,"waterfront"],
["Harbourfront","Near Music Garden",43.6374,-79.3994,"waterfront"],
["Harbourfront","Near Queens Quay & Spadina",43.6372,-79.3975,"waterfront"],
["Waterfront East","Near Sugar Beach",43.6425,-79.3667,"waterfront"],
["Waterfront West","Near Trillium Park",43.6315,-79.4130,"waterfront"],
["Downtown","Near Nathan Phillips Square",43.6525,-79.3839,"central"],
["Downtown","Near Queen & University",43.6520,-79.3905,"central"],
["Entertainment District","Near John & Richmond",43.6460,-79.3901,"central"],
["Queen West","Near Graffiti Alley",43.6470,-79.4000,"west"],
["Queen West","Near Queen & Spadina",43.6487,-79.3957,"west"],
["Queen West","Near Queen & Bathurst",43.6474,-79.4052,"west"],
["Trinity Bellwoods","Near Trinity Bellwoods Park",43.6475,-79.4140,"west"],
["Ossington","Near Ossington & Queen",43.6432,-79.4203,"west"],
["Ossington","Near Ossington & Dundas",43.6498,-79.4202,"west"],
["Kensington Market","Near Baldwin & Kensington",43.6544,-79.4004,"west"],
["Kensington Market","Near Bellevue Square",43.6524,-79.4027,"west"],
["Chinatown","Near Dundas & Spadina",43.6534,-79.3972,"west"],
["The Annex","Near Bloor & Brunswick",43.6658,-79.4051,"central"],
["The Annex","Near Harbord & Bathurst",43.6614,-79.4077,"central"],
["Yorkville","Near Village of Yorkville Park",43.6703,-79.3936,"central"],
["King West","Near King & Spadina",43.6452,-79.3950,"west"],
["King West","Near King & Bathurst",43.6444,-79.4008,"west"],
["Parkdale","Near Queen & Roncesvalles",43.6409,-79.4470,"west"],
["Little Italy","Near College & Ossington",43.6547,-79.4200,"west"],
["Little Portugal","Near Dundas & Dovercourt",43.6507,-79.4311,"west"],
["Roncesvalles","Near Roncesvalles & Dundas",43.6497,-79.4490,"west"]
];

const normalDates=[
{vibe:"chill",text:"Find a café, patio, park bench, lookout, or other comfortable spot nearby and stay for at least 30 minutes.",budget:"free"},
{vibe:"chill",text:"Walk in one direction until you find somewhere you both genuinely want to stop. No review apps.",budget:"free"},
{vibe:"chill",text:"Find somewhere to get a drink and sit somewhere neither of you has been before.",budget:"casual"},
{vibe:"playful",text:"Go into the first interesting shop you see. Each of you gets $10 to find the weirdest thing.",budget:"casual"},
{vibe:"playful",text:"Take turns choosing the next street until you find somewhere worth stopping.",budget:"free"},
{vibe:"food",text:"Find a place neither of you has tried and order one thing to share that neither of you would normally choose.",budget:"casual"},
{vibe:"food",text:"Find the best snack you can within walking distance. No review apps.",budget:"casual"},
{vibe:"food",text:"Pick a cuisine neither of you has eaten together before and find somewhere to try it.",budget:"casual"},
{vibe:"drinks",text:"Find a café, bar, or patio nearby. One person chooses the first order.",budget:"nice"},
{vibe:"drinks",text:"Get one drink somewhere nearby, then walk until you find a second place that looks better.",budget:"nice"},
{vibe:"adventure",text:"You cannot use Maps to choose your next stop. Wander and follow whatever catches your attention.",budget:"free"},
{vibe:"adventure",text:"Find something neither of you has done together before. If it costs money, make it worth it.",budget:"nice"}
];

const chaosDates={
mild:[
{text:"Find a place neither of you has tried before and order something neither of you normally gets.",budget:"free"},
{text:"Go into the first shop that catches your eye. Each person gets five minutes to pick something for the other.",budget:"casual"},
{text:"Take turns choosing left or right at each intersection for 15 minutes.",budget:"free"},
{text:"Find a place with a game you've never played and play one round.",budget:"casual"},
{text:"Each person picks a direction. Walk that way for 10 minutes before deciding where to stop.",budget:"free"}
],
weird:[
{text:"Find the nearest thrift store. You each have $5 to find the strangest object you can.",budget:"casual"},
{text:"Find the nearest park. Each of you gets five minutes to find the strangest thing within it.",budget:"free"},
{text:"For the next 20 minutes, neither of you can say “yes” or “no.”",budget:"free"},
{text:"Find the nearest convenience store. You each have $3 to buy the other person something they've never tried.",budget:"free"},
{text:"Find an antique or vintage shop. Each of you has to identify the object with the most confusing purpose.",budget:"free"},
{text:"Find a public piano. One person chooses something the other has to attempt to play, regardless of skill.",budget:"free"},
{text:"Find the strangest storefront, sign, or piece of public art nearby. Whoever spots it first chooses the next direction.",budget:"free"},
{text:"Go somewhere neither of you would normally choose for a date. Stay for at least 20 minutes.",budget:"free"}
],
chaotic:[
{text:"Go to the nearest convenience store. You each have $5 to assemble a meal for the other person. You have to eat what they chose.",budget:"casual"},
{text:"Find the nearest karaoke bar. You each choose the other's first song. No vetoes.",budget:"nice"},
{text:"Find the nearest arcade, pool hall, bowling alley, or game spot. Invent your own competition and play it.",budget:"nice"},
{text:"Find the nearest thrift store. You each have $10 to buy an outfit or accessory the other person has to wear for the rest of the date.",budget:"casual"},
{text:"Go into the first shop you see and ask the person working there what they would do nearby for a fun date.",budget:"free"},
{text:"Find somewhere selling food neither of you has ever eaten. That's what you're having.",budget:"casual"},
{text:"Find a place with live music without checking who is playing. Go in and stay for at least one song.",budget:"nice"},
{text:"Go to the nearest grocery store. You each have $10 to buy ingredients for something the other person has to invent.",budget:"casual"}
],
unhinged:[
{text:"Find a laundromat. Get a snack nearby and spend 20 minutes there together. You are not allowed to explain why you chose it.",budget:"free"},
{text:"Find the nearest karaoke bar. Each person chooses a song for the other person and you both have to perform it.",budget:"nice"},
{text:"Go to the nearest public piano. One person chooses a song the other person has to attempt to play. No matter how bad it is, finish it.",budget:"free"},
{text:"Find the nearest dollar store. You each have $10 to assemble a completely inexplicable gift for the other person.",budget:"casual"},
{text:"Find the nearest flower shop. You each have $10 to make the strangest bouquet possible for the other person.",budget:"casual"},
{text:"Walk for 20 minutes without using Maps. Every time either person spots something genuinely strange, you must stop and investigate it.",budget:"free"},
{text:"Go to the nearest grocery store. Each person has $10 to create the other person's three-course meal. You have to eat it somewhere nearby.",budget:"casual"},
{text:"Find a place neither of you has heard of. Walk in and ask what the strangest thing they've ever had someone do there was.",budget:"free"},
{text:"Find the nearest arcade or game venue. The loser of your first game has to choose the next three stops.",budget:"casual"},
{text:"Go to the nearest thrift store. Each person gets $15 to assemble the other person's most ridiculous date outfit. Wear one piece for the rest of the night.",budget:"casual"}
]
};

const chaosLabels={normal:"Normal",mild:"Mild",weird:"Weird",chaotic:"Chaotic",unhinged:"Unhinged"};
const budgetLabels={free:"Mostly Free",casual:"Casual",nice:"Nice",treat:"Treat Ourselves"};

const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let current=null;


$("chaos").addEventListener("change",()=>{
 const c=$("chaos").value;
 const notes={normal:"Normal date ideas.",mild:"A little unusual.",weird:"Properly strange.",chaotic:"Things may get ridiculous.",unhinged:"Why are we doing this?"};
 $("chaosNote").textContent=notes[c];
});

function chooseLocation(){
 const a=$("area").value;
 let pool=a==="any"?locations:locations.filter(x=>x[4]===a);
 if(!pool.length)pool=locations;
 let x=pick(pool);
 if(current&&pool.length>1)while(x[1]===current.location[1])x=pick(pool);
 return x;
}
function chooseDate(){
 const chaos=$("chaos").value;
 const budget=$("budget").value;
 const vibe=$("vibe").value;
 let pool;

 if(chaos==="normal"){
   pool=normalDates;
   if(vibe!=="any"){
     const vibePool=pool.filter(d=>d.vibe===vibe);
     if(vibePool.length)pool=vibePool;
   }
 }else{
   pool=chaosDates[chaos] || chaosDates.mild;
 }

 if(budget!=="any"){
   const budgetPool=pool.filter(d=>d.budget===budget);
   if(budgetPool.length)pool=budgetPool;
 }

 return pick(pool);
}

function saveHistory(){
 let h=[];
 try{h=JSON.parse(localStorage.getItem("date-roulette-history")||"[]");}catch(e){}
 h.unshift({location:current.location[1],area:current.location[0],date:current.date.text});
 localStorage.setItem("date-roulette-history",JSON.stringify(h.slice(0,5)));
 renderHistory();
}

function renderHistory(){
 let h=[];
 try{h=JSON.parse(localStorage.getItem("date-roulette-history")||"[]");}catch(e){}
 if(!h.length){$("recentCard").style.display="none";return;}
 $("recentCard").style.display="block";
 $("history").innerHTML=h.map(x=>'<div class="history-item"><b>'+escapeHtml(x.area)+'</b> — '+escapeHtml(x.date)+'</div>').join("");
}

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function render(){
 $("point").textContent=current.location[1];
 $("areaText").textContent=current.location[0];

 // IMPORTANT: the main result is always the actual date suggestion.
 $("date").textContent=current.date.text;

 const chaos=$("chaos").value;
 const chaosLabel=chaosLabels[chaos] || "Normal";
 const budgetLabel=budgetLabels[current.date.budget] || "Any budget";

 $("tags").innerHTML='<span class="tag">'+chaosLabel+'</span><span class="tag">'+budgetLabel+'</span>';
 $("result").classList.add("show");
 saveHistory();
}

function spin(){
 $("spin").disabled=true;$("surprise").disabled=true;$("newDate").disabled=true;
 $("roulette").classList.add("show");$("result").classList.remove("show");
 window.setTimeout(()=>{
   try{
     current={location:chooseLocation(),date:chooseDate()};
     render();
   }catch(e){
     console.error(e);
     alert("Something went wrong. Please refresh and try again.");
   }finally{
     $("roulette").classList.remove("show");
     $("spin").disabled=false;$("surprise").disabled=false;$("newDate").disabled=false;
   }
 },650);
}
$("spin").addEventListener("click",spin);
$("newDate").addEventListener("click",spin);
$("surprise").addEventListener("click",()=>{
 $("area").value="any";
 $("vibe").value="any";
 $("budget").value="any";
 $("chaos").value=pick(["normal","mild","weird","chaotic","unhinged"]);
 $("chaos").dispatchEvent(new Event("change"));
 spin();
});
$("map").addEventListener("click",()=>{
 if(current)window.location.href="https://www.google.com/maps/search/?api=1&query="+current.location[2]+","+current.location[3];
});
$("clearHistory").addEventListener("click",()=>{
 localStorage.removeItem("date-roulette-history");
 $("history").innerHTML="";
 $("recentCard").style.display="none";
});
renderHistory();
</script>
</body>
</html>
