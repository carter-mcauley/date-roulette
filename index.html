<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34383a">
<title>Date Roulette 🎲</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f0e9;--ink:#171717;--muted:#6b6b6b;--card:#fff;--soft:#f1efec}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:42px 28px 56px}
h1{font-size:clamp(52px,11vw,92px);line-height:.88;letter-spacing:-5px;margin:0 0 20px;font-weight:850}
.intro{font-size:clamp(20px,4vw,29px);line-height:1.3;color:var(--muted);margin:0 0 38px;letter-spacing:-.7px}
.card{background:var(--card);border-radius:34px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.control{background:var(--soft);border-radius:25px;padding:20px 22px;min-height:116px}
.label{text-transform:uppercase;letter-spacing:3px;font-size:13px;color:#777;font-weight:850;margin-bottom:13px}
select{appearance:auto;width:100%;border:0;background:transparent;color:var(--ink);font-size:22px;font-weight:750;padding:0;outline:none}
button{font:inherit;border:0;cursor:pointer}
.primary{width:100%;background:#151515;color:#fff;border-radius:27px;padding:25px 20px;margin-top:20px;font-size:24px;font-weight:900;box-shadow:0 7px #000}
.primary:active{transform:translateY(4px);box-shadow:0 3px #000}
.primary:disabled{opacity:.55;cursor:default}
.secondary{width:100%;background:#ece9e5;color:#171717;border-radius:22px;padding:17px 20px;margin-top:13px;font-size:16px;font-weight:800}
.chaos-note{font-size:12px;color:#888;margin-top:10px;line-height:1.4}
.recent{margin-top:18px}.recent-title{font-size:13px;letter-spacing:3px;color:#777;font-weight:850;margin-bottom:18px}
.history-item{padding:15px 0;border-top:1px solid #e4e2df;font-size:18px;line-height:1.45}
.history-item:first-child{border-top:0;padding-top:0}
.history-item b{font-weight:850}
.clear{background:none;color:#777;text-decoration:underline;font-size:12px;padding:0;float:right}
.roulette{display:none;text-align:center;padding:42px;font-size:17px}.roulette.show{display:block}
.die{font-size:60px;display:inline-block;animation:roll .7s linear infinite}
@keyframes roll{to{transform:rotate(360deg)}}
.result{display:none;margin-top:18px}.result.show{display:block}
.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:12px;color:#777;font-weight:850}
.point{font-size:36px;letter-spacing:-1.5px;font-weight:900;margin:5px 0}
.area{font-size:15px;color:#777}
.rule{background:var(--soft);border-radius:17px;padding:16px;margin-top:18px;font-size:14px;line-height:1.5}
.date{font-size:21px;line-height:1.45;margin-top:7px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{background:#eee;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800}
.map{width:100%;background:#e7efe7;color:#17451c;border-radius:20px;padding:17px;margin-top:17px;font-weight:850}
@media(max-width:520px){
 main{padding:32px 18px 42px}
 h1{letter-spacing:-3px}
 .card{border-radius:30px;padding:22px}
 .grid{gap:10px}
 .control{border-radius:22px;padding:17px;min-height:103px}
 select{font-size:18px}
 .primary{font-size:21px}
 .history-item{font-size:16px}
}
</style>
</head>
<body>
<main>
<h1>Date<br>Roulette 🎲</h1>
<p class="intro">A random Toronto neighbourhood + a date.<br>Stop planning. Just go.</p>

<section class="card">
<div class="grid">
<div class="control">
<div class="label">Area</div>
<select id="area">
<option value="any">Anywhere downtown</option>
<option value="west">West</option>
<option value="central">Central</option>
<option value="east">East</option>
<option value="waterfront">Waterfront</option>
</select>
</div>

<div class="control">
<div class="label">Vibe</div>
<select id="vibe">
<option value="any">Surprise me</option>
<option value="chill">Chill</option>
<option value="playful">Playful</option>
<option value="food">Food</option>
<option value="drinks">Drinks</option>
<option value="adventure">Adventure</option>
</select>
</div>

<div class="control">
<div class="label">Budget</div>
<select id="budget">
<option value="any">Any budget</option>
<option value="free">Mostly Free · $0–30</option>
<option value="casual">Casual · $30–60</option>
<option value="nice">Nice · $60–100</option>
<option value="treat">Treat · $100–200+</option>
</select>
</div>

<div class="control">
<div class="label">Chaos</div>
<select id="chaos">
<option value="normal">Normal</option>
<option value="mild">Mild</option>
<option value="weird">Weird</option>
<option value="chaotic">Chaotic</option>
<option value="unhinged">Unhinged</option>
</select>
<div class="chaos-note" id="chaosNote">Normal date ideas.</div>
</div>
</div>

<button class="primary" id="spin" type="button">SPIN THE DATE 🎰</button>
<button class="secondary" id="surprise" type="button">🎲 Surprise us</button>
</section>

<section id="roulette" class="card roulette">
<div class="die">🎲</div>
<div>Rolling your date…</div>
</section>

<section id="result" class="card result">
<div class="eyebrow">Where?</div>
<div class="point" id="point"></div>
<div class="area" id="areaText"></div>
<div class="rule"><b>Start here.</b> Don't plan the destination beforehand. The point is to arrive here and see what the area gives you.</div>
<div style="margin-top:20px">
<div class="eyebrow">Your date</div>
<div class="date" id="date"></div>
<div class="tags" id="tags"></div>
</div>
<button class="map" id="map" type="button">📍 Open starting point in Maps</button>
<button class="secondary" id="newDate" type="button">🎲 Spin again</button>
</section>

<section class="card recent" id="recentCard" style="display:none">
<button class="clear" id="clearHistory" type="button">Clear</button>
<div class="recent-title">RECENT DATES</div>
<div id="history"></div>
</section>
</main>

":"playful"},{"text":"Walk until you see a business you cannot immediately explain. Figure out what happens there.","budget":"free","vibe":"adventure"},{"text":"Find a dessert place and each choose the other's dessert.","budget":"casual","vibe":"food"},{"text":"Find a bar with at least one game. The loser of the first round chooses where you go next.","budget":"nice","vibe":"playful"},{"text":"Find somewhere with a patio and let a coin flip decide whether you stay for one drink or keep walking.","budget":"nice","vibe":"drinks"},{"text":"Choose a random number from 1–10. Find a building nearby with that number somewhere on it.","budget":"free","vibe":"adventure"},{"text":"Find the nearest place neither of you has heard of and make that the next stop.","budget":"free","vibe":"adventure"},{"text":"Each person gets one veto for the next hour. After both are used, the next suggestion is mandatory.","budget":"casual","vibe":"playful"},{"text":"Find a restaurant with a dish neither of you has tried. Split one and judge it honestly.","budget":"casual","vibe":"food"}],"weird":[{"text":"Find the nearest park. Each person gets five minutes to find the strangest thing in it. Best find chooses the next stop.","budget":"free","vibe":"playful"},{"text":"For the next 20 minutes, neither of you can say “yes” or “no.” If someone does, the other chooses the next direction.","budget":"free","vibe":"playful"},{"text":"Find the strangest storefront, sign, or piece of public art within your walking area. Stop and investigate it.","budget":"free","vibe":"adventure"},{"text":"Find the nearest thrift store. You each have $5 to find the strangest object you can.","budget":"casual","vibe":"playful"},{"text":"Find a convenience store and each choose the strangest drink under $4 for the other person.","budget":"casual","vibe":"drinks"},{"text":"Find an antique or vintage shop. Each of you has to identify the object with the most confusing purpose.","budget":"free","vibe":"adventure"},{"text":"Find a public piano. One person chooses something the other has to attempt to play, regardless of skill.","budget":"free","vibe":"playful"},{"text":"Go somewhere neither of you would normally choose for a date. Stay for at least 20 minutes.","budget":"free","vibe":"adventure"},{"text":"Find a menu item with a name you don't understand. Order it and don't look it up until it arrives.","budget":"casual","vibe":"food"},{"text":"Find a business with a person's first name in it. Figure out who the person is.","budget":"free","vibe":"adventure"},{"text":"Find a street with an unusually specific name and walk it from one end to the other.","budget":"free","vibe":"adventure"},{"text":"Find something for sale that neither of you can identify. Ask the person working there what it is.","budget":"casual","vibe":"playful"},{"text":"Find the nearest place with a game neither of you has played. Learn it from scratch.","budget":"casual","vibe":"playful"},{"text":"Find a restaurant with one dish that sounds completely unlike the rest of the menu. Share it.","budget":"casual","vibe":"food"},{"text":"Find a bar with the strangest drink name you can find. One person orders it for the other.","budget":"nice","vibe":"drinks"},{"text":"Find a public clock. Whatever time it shows determines how many minutes you walk before stopping.","budget":"free","vibe":"adventure"},{"text":"Find a business that has been around for a long time and figure out what used to be in its space.","budget":"free","vibe":"adventure"},{"text":"Find a shop with an object that costs less than $5 and makes absolutely no sense as a date purchase. Buy it.","budget":"casual","vibe":"playful"},{"text":"Find the closest restaurant neither of you has heard of and go in without reading reviews.","budget":"casual","vibe":"food"},{"text":"Find a place with live music. Go in without checking who is playing first.","budget":"nice","vibe":"drinks"},{"text":"Pick a random letter. Your next destination has to begin with that letter.","budget":"free","vibe":"adventure"},{"text":"Find someone wearing a hat. Ask them to choose between two directions you give them.","budget":"free","vibe":"adventure"},{"text":"Find a person whose first name starts with the same letter as one of you. Ask them to choose a number from 1–10; walk that many minutes.","budget":"free","vibe":"playful"},{"text":"Find a place with a menu item you've never heard of. The first person to spot it chooses whether you share it.","budget":"casual","vibe":"food"}],"chaotic":[{"text":"Walk for 20 minutes without using Maps. Every time either person spots something genuinely strange, you have to stop and investigate it.","budget":"free","vibe":"adventure"},{"text":"Find a public piano. The person who claims they are better at music has to prove it first.","budget":"free","vibe":"playful"},{"text":"Go into the first shop you see and ask the person working there what they would do nearby for a fun date. Pick one of their suggestions.","budget":"free","vibe":"adventure"},{"text":"Go to the nearest convenience store. You each have $5 to assemble a meal for the other person. You have to eat what they chose.","budget":"casual","vibe":"food"},{"text":"Find the nearest thrift store. You each have $10 to buy an accessory the other person has to wear for the rest of the date.","budget":"casual","vibe":"playful"},{"text":"Find a grocery store. Each person gets $10 to create the other person's dinner from ingredients they choose.","budget":"casual","vibe":"food"},{"text":"Find the nearest karaoke bar. You each choose the other's first song. No vetoes.","budget":"nice","vibe":"playful"},{"text":"Find an arcade, pool hall, bowling alley, or game venue and invent your own competition before you start.","budget":"nice","vibe":"playful"},{"text":"Find a place with live music without checking who is playing. Go in and stay for at least one song.","budget":"nice","vibe":"drinks"},{"text":"Pick a random number between 1 and 50. Find that number displayed somewhere in the city before you continue.","budget":"free","vibe":"adventure"},{"text":"The next three decisions must be made by coin flip. No arguing with the results.","budget":"free","vibe":"adventure"},{"text":"Find a stranger willing to settle a harmless disagreement between you. Their answer decides what you do next.","budget":"free","vibe":"playful"},{"text":"Find someone named Martin. If you find him, give him a genuine compliment and walk away. Do not explain why.","budget":"free","vibe":"playful"},{"text":"Find someone wearing a Toronto sports jersey. Ask them to choose a number from 1–20. Walk that many minutes.","budget":"free","vibe":"adventure"},{"text":"Find a person who has lived in Toronto longer than either of you. Ask them where they would go for a fun night. Go there if it is practical.","budget":"free","vibe":"adventure"},{"text":"Find a business with a person's name in it. Go inside and ask what the name refers to.","budget":"free","vibe":"adventure"},{"text":"Go into the next shop you see. The first object one of you touches determines what you have to find next.","budget":"free","vibe":"adventure"},{"text":"Find a restaurant where neither of you can pronounce something on the menu. Order it.","budget":"casual","vibe":"food"},{"text":"You have $10 and 20 minutes to acquire something that becomes the mascot of the rest of the date.","budget":"casual","vibe":"playful"},{"text":"Find a dog whose owner will tell you its name. If the name has one syllable, go east; otherwise go west.","budget":"free","vibe":"adventure"},{"text":"Find someone willing to choose between two restaurants you name. Go to whichever they pick.","budget":"casual","vibe":"food"},{"text":"Find a stranger who will give you a number from 1–10. That is how many minutes you have to reach your next stop.","budget":"free","vibe":"adventure"},{"text":"Find the nearest place where someone is visibly doing something unusual. Go investigate from a respectful distance.","budget":"free","vibe":"adventure"},{"text":"Find a shop employee willing to give you a completely arbitrary, harmless challenge. Attempt it.","budget":"free","vibe":"playful"}],"unhinged":[{"text":"Find a laundromat. Get a snack nearby and spend 20 minutes there together. Do not explain to anyone why you chose it.","budget":"free","vibe":"adventure"},{"text":"Find a public piano. The person who claims they are better at music has to prove it first, regardless of the audience.","budget":"free","vibe":"playful"},{"text":"Find the nearest dollar store. You each have $10 to assemble a completely inexplicable gift for the other person.","budget":"casual","vibe":"playful"},{"text":"Find a grocery store. Each person has $10 to create the other person's three-course meal. You have to eat it somewhere nearby.","budget":"casual","vibe":"food"},{"text":"Find the nearest thrift store. Each person gets $15 to assemble one ridiculous date-night outfit for the other person. Wear one piece for the rest of the night.","budget":"casual","vibe":"playful"},{"text":"Find a bar and ask the bartender to choose a drink for you using only three random words you give them.","budget":"nice","vibe":"drinks"},{"text":"Find a karaoke bar. The person who says they don't want to sing has to choose the first song.","budget":"nice","vibe":"playful"},{"text":"Find a game venue. The loser of the first game has to make the next major decision of the night.","budget":"nice","vibe":"adventure"},{"text":"Find a place neither of you has heard of. Walk in and ask what the strangest thing they've ever had someone do there was.","budget":"free","vibe":"adventure"},{"text":"Find the weirdest-looking place within your area and commit to staying for at least one drink, course, or activity.","budget":"treat","vibe":"adventure"},{"text":"Find a man named Martin. Give him $5. Walk away. Do not explain.","budget":"casual","vibe":"playful"},{"text":"Find someone named Alex. If you find one, they decide what you eat next.","budget":"casual","vibe":"food"},{"text":"Find someone wearing a hat. Ask them where they would take someone on a first date. If practical, go there.","budget":"free","vibe":"adventure"},{"text":"Find someone whose name starts with M. Ask them to choose between food and drinks. Whatever they say determines the next hour.","budget":"any","vibe":"drinks"},{"text":"Find a stranger who will choose your next destination from three options you give them. You have to go there.","budget":"free","vibe":"adventure"},{"text":"Find a stranger willing to give you a word. You have 30 minutes to find that word written somewhere.","budget":"free","vibe":"adventure"},{"text":"Find someone who has been to a country neither of you has visited. Ask them to name one food from there. Find it.","budget":"casual","vibe":"food"},{"text":"Pick a random street on the map. Reach it within 30 minutes without using Maps for navigation.","budget":"free","vibe":"adventure"},{"text":"The next person you see carrying food determines what you eat next, provided it is reasonably accessible.","budget":"casual","vibe":"food"},{"text":"Find a business you've walked past at least three times but never entered. Go inside.","budget":"free","vibe":"adventure"},{"text":"Choose a random number from 1–100. Find that number displayed somewhere before you continue.","budget":"free","vibe":"adventure"},{"text":"Find a place that has been open for at least 20 years. Ask someone there what has changed the most.","budget":"free","vibe":"adventure"},{"text":"You have $7.43 to spend before the date can continue. You decide what counts, but you must spend it all.","budget":"casual","vibe":"playful"},{"text":"Flip a coin three times. Heads means left, tails means right. Follow all three results, then stop at the first place you see.","budget":"free","vibe":"adventure"}]};
const chaosLabels={normal:"Normal",mild:"Mild",weird:"Weird",chaotic:"Chaotic",unhinged:"Unhinged"};
const budgetLabels={free:"Mostly Free",casual:"Casual",nice:"Nice",treat:"Treat Ourselves"};
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let current=null;


$("chaos").addEventListener("change",()=>{
 const c=$("chaos").value;
 const notes={normal:"Normal date ideas.",mild:"A little unusual.",weird:"Properly strange.",chaotic:"Things may get ridiculous.",unhinged:"Why are we doing this?"};
 $("chaosNote").textContent=notes[c];
});

function chooseLocation(){
 const a=$("area").value;
 let pool=a==="any"?locations:locations.filter(x=>x[4]===a);
 if(!pool.length)pool=locations;
 let x=pick(pool);
 if(current&&pool.length>1)while(x[1]===current.location[1])x=pick(pool);
 return x;
}
function chooseDate(){
 const chaosLevel=$("chaos").value;
 const selectedBudget=$("budget").value;
 const selectedVibe=$("vibe").value;

 let pool;
 if(chaosLevel==="normal"){
   pool=normalDates.filter(d=>
     (selectedVibe==="any" || d.vibe===selectedVibe) &&
     (selectedBudget==="any" || d.budget===selectedBudget)
   );
 }else{
   pool=(chaosDates[chaosLevel]||[]).filter(d=>
     (selectedVibe==="any" || d.vibe===selectedVibe) &&
     (selectedBudget==="any" || d.budget===selectedBudget)
   );
 }

 // The expanded library is intentionally large enough that normal filter
 // combinations and chaos+vibe+budget combinations have matching results.
 // If an impossible combination is ever introduced later, fail visibly
 // instead of silently ignoring a user's filter.
 if(!pool.length){
   return {
     text:"No date in this combination yet — try another filter.",
     budget:selectedBudget==="any"?"free":selectedBudget,
     vibe:selectedVibe==="any"?"chill":selectedVibe,
     unavailable:true
   };
 }

 return pick(pool);
}

function saveHistory(){
 let h=[];
 try{h=JSON.parse(localStorage.getItem("date-roulette-history-v11")||"[]");}catch(e){}
 h.unshift({location:current.location[1],area:current.location[0],date:current.date.text});
 localStorage.setItem("date-roulette-history-v11",JSON.stringify(h.slice(0,5)));
 renderHistory();
}

function renderHistory(){
 let h=[];
 try{h=JSON.parse(localStorage.getItem("date-roulette-history-v11")||"[]");}catch(e){}
 if(!h.length){$("recentCard").style.display="none";return;}
 $("recentCard").style.display="block";
 $("history").innerHTML=h.map(x=>'<div class="history-item"><b>'+escapeHtml(x.area)+'</b> — '+escapeHtml(x.date)+'</div>').join("");
}

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function render(){
 $("point").textContent=current.location[1];
 $("areaText").textContent=current.location[0];

 $("date").textContent=current.date.text;

 const chaos=$("chaos").value;
 const chaosLabel=chaosLabels[chaos] || "Normal";
 const budgetLabel=budgetLabels[current.date.budget] || "Any budget";
 const vibeLabel=selectedVibeLabel();

 $("tags").innerHTML=
   '<span class="tag">'+chaosLabel+'</span>'+
   '<span class="tag">'+budgetLabel+'</span>'+
   (vibeLabel ? '<span class="tag">'+vibeLabel+'</span>' : '');

 if(current.date.unavailable){
   $("date").style.opacity=".65";
 }else{
   $("date").style.opacity="1";
 }

 $("result").classList.add("show");
 saveHistory();
}

function selectedVibeLabel(){
 const labels={chill:"Chill",playful:"Playful",food:"Food",drinks:"Drinks",adventure:"Adventure"};
 const v=$("vibe").value;
 return v==="any" ? "" : labels[v] || "";
}

function spin(){
 $("spin").disabled=true;$("surprise").disabled=true;$("newDate").disabled=true;
 $("roulette").classList.add("show");$("result").classList.remove("show");
 window.setTimeout(()=>{
   try{
     current={location:chooseLocation(),date:chooseDate()};
     render();
   }catch(e){
     console.error(e);
     alert("Something went wrong. Please refresh and try again.");
   }finally{
     $("roulette").classList.remove("show");
     $("spin").disabled=false;$("surprise").disabled=false;$("newDate").disabled=false;
   }
 },650);
}
$("spin").addEventListener("click",spin);
$("newDate").addEventListener("click",spin);
$("surprise").addEventListener("click",()=>{
 $("area").value="any";
 $("vibe").value="any";
 $("budget").value="any";
 $("chaos").value=pick(["normal","mild","weird","chaotic","unhinged"]);
 $("chaos").dispatchEvent(new Event("change"));
 spin();
});
$("map").addEventListener("click",()=>{
 if(current)window.location.href="https://www.google.com/maps/search/?api=1&query="+current.location[2]+","+current.location[3];
});
$("clearHistory").addEventListener("click",()=>{
 localStorage.removeItem("date-roulette-history-v11");
 $("history").innerHTML="";
 $("recentCard").style.display="none";
});
renderHistory();
</script>
</body>
</html>
